[package]
name    = "lending"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
testutils = ["soroban-sdk/testutils"]
kani = []

[dependencies]
soroban-sdk.workspace = true

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
proptest = { version = "1", default-features = false, features = ["std"] }
borrower-loyalty = { path = "../borrower_loyalty" }
referral-rewards = { path = "../referral_rewards" }
borrower-reputation = { path = "../borrower_reputation" }
